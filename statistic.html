<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 Финансы: Статистика</title>
    <style>
        :root {
            --bg: #f4f6f9; --card: #ffffff; --text: #1f2937; --text2: #6b7280;
            --income: #10b981; --income-bg: #d1fae5;
            --expense: #ef4444; --expense-bg: #fee2e2;
            --savings: #3b82f6; --savings-bg: #dbeafe;
            --primary: #3b82f6; --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; padding: 16px; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 16px; font-size: 1.6rem; }
        
        /* Фильтры */
        .filters { background: var(--card); padding: 16px; border-radius: 12px; box-shadow: var(--shadow); margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 12px; align-items: end; justify-content: center; }
        .filter-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 120px; }
        .filter-group label { font-size: 12px; color: var(--text2); font-weight: 600; }
        .filter-group input { padding: 8px; border: 1px solid #e5e7eb; border-radius: 6px; font-size: 14px; width: 100%; }
        .btn-filter { padding: 8px 16px; background: var(--primary); color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; height: 38px; }
        .btn-reset { padding: 8px 16px; background: #f3f4f6; color: var(--text); border: none; border-radius: 6px; font-weight: 600; cursor: pointer; height: 38px; }
        
        .summary { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
        @media(min-width:600px) { .summary { grid-template-columns: repeat(4, 1fr); } }
        .stat-card { background: var(--card); padding: 16px; border-radius: 12px; box-shadow: var(--shadow); text-align: center; }
        .stat-card h3 { font-size: 12px; color: var(--text2); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-card .value { font-size: 22px; font-weight: 800; }
        .val-income { color: var(--income); } .val-expense { color: var(--expense); }
        .val-balance { color: #8b5cf6; } .val-savings { color: var(--savings); }

        .entries { display: flex; flex-direction: column; gap: 12px; }
        .entry-card { background: var(--card); padding: 14px 16px; border-radius: 12px; box-shadow: var(--shadow); border-left: 4px solid transparent; transition: opacity 0.3s; }
        .entry-card.income { border-left-color: var(--income); }
        .entry-card.expense { border-left-color: var(--expense); }
        .entry-card.savings { border-left-color: var(--savings); }
        
        .entry-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
        .badge.income { background: var(--income-bg); color: #065f46; }
        .badge.expense { background: var(--expense-bg); color: #991b1b; }
        .badge.savings { background: var(--savings-bg); color: #1e40af; }
        .date { font-size: 13px; color: var(--text2); font-weight: 500; }
        
        .entry-body { display: flex; flex-wrap: wrap; gap: 10px; align-items: baseline; }
        .amount { font-size: 18px; font-weight: 700; min-width: 80px; }
        .category { background: #f3f4f6; padding: 4px 10px; border-radius: 8px; font-size: 14px; }
        .comment { font-size: 13px; color: var(--text2); font-style: italic; margin-left: auto; max-width: 40%; word-break: break-word; }

        .footer { text-align: center; margin-top: 24px; padding: 12px; font-size: 12px; color: #9ca3af; }
        .empty-state { text-align: center; padding: 30px; color: var(--text2); background: var(--card); border-radius: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Учет финансов</h1>
        
        <!-- Панель фильтров -->
        <div class="filters">
            <div class="filter-group">
                <label>Дата с:</label>
                <input type="date" id="dateStart">
            </div>
            <div class="filter-group">
                <label>Дата по:</label>
                <input type="date" id="dateEnd">
            </div>
            <button class="btn-filter" onclick="applyFilter()">🔍 Фильтр</button>
            <button class="btn-reset" onclick="resetFilter()">↺ Сброс</button>
        </div>

        <div class="summary" id="summaryBlock">
            <div class="stat-card"><h3>💵 Доходы</h3><div class="value val-income" id="sumIncome">0 ₽</div></div>
            <div class="stat-card"><h3>💸 Расходы</h3><div class="value val-expense" id="sumExpense">0 ₽</div></div>
            <div class="stat-card"><h3>⚖️ Баланс</h3><div class="value val-balance" id="sumBalance">0 ₽</div></div>
            <div class="stat-card"><h3>🏦 Накопления</h3><div class="value val-savings" id="sumSavings">0 ₽</div></div>
        </div>

        <div class="entries" id="entriesList"></div>
        <div class="footer" id="updateTime"></div>
    </div>

    <script>
        let ALL_ENTRIES = []; // Храним все записи глобально

        function parseFinanceData(text) {
            // Очистка от JSON обертки {"text":"..."}
            if (text.trim().startsWith('{')) {
                try {
                    const json = JSON.parse(text);
                    if (json.text) text = json.text;
                } catch (e) {}
            }

            const blocks = text.split(/\n\s*\n/);
            const entries = [];
            
            blocks.forEach(block => {
                const lines = block.trim().split('\n').filter(l => l.trim());
                if (lines.length < 2) return;

                const typeLine = lines[0].trim();
                let type = 'unknown';
                if (typeLine.includes('💸')) type = 'savings';
                else if (typeLine.includes('🟢')) type = 'income';
                else if (typeLine.includes('🔴')) type = 'expense';
                
                if (type === 'unknown') return;

                // Объединяем все строки кроме первой (заголовка) в одну линию
                const rawContent = lines.slice(1).join(' ').replace(/\s+/g, ' ');
                
                // 1. Ищем дату (формат ДД-ММ-ГГГГ)
                const dateMatch = rawContent.match(/(\d{2}-\d{2}-\d{4})/);
                let dateStr = '—';
                let dateObj = null;
                
                if (dateMatch) {
                    dateStr = dateMatch[1];
                    const parts = dateStr.split('-');
                    // Создаем объект даты для фильтрации (Год, Месяц-1, День)
                    dateObj = new Date(parts[2], parts[1] - 1, parts[0]);
                }

                // Удаляем дату из строки для дальнейшего парсинга
                const contentWithoutDate = rawContent.replace(dateMatch ? dateMatch[0] : '', '').replace(/^,\s*/, '');

                // Разбиваем по разделителю |
                const segments = contentWithoutDate.split('|').map(s => s.trim()).filter(s => s);
                
                let amount = 0;
                let category = '';
                let comment = '';
                let foundAmount = false;

                segments.forEach(seg => {
                    // Очищаем сегмент от валюты для поиска числа
                    const cleanSeg = seg.replace(/[₽$€]/g, '');
                    
                    // Ищем число (сумму). Если нашли первое число - считаем его суммой
                    const numMatch = cleanSeg.match(/(\d+(?:\.\d+)?)/);
                    
                    if (!foundAmount && numMatch) {
                        amount = parseFloat(numMatch[1]);
                        foundAmount = true;
                        // Остаток сегмента после числа может быть комментарием
                        const extra = cleanSeg.replace(numMatch[0], '').trim();
                        if (extra) comment += ' ' + extra;
                    } 
                    // Если сумма уже найдена, или числа нет, то это категория или комментарий
                    else {
                        // Если в сегменте есть эмодзи и категория еще пуста - это категория
                        if (/[\p{Emoji}]/u.test(seg) && !category) {
                            category = seg;
                        } 
                        // Если категории нет, берем первый текстовый сегмент как категорию
                        else if (!category) {
                            category = seg;
                        } 
                        // Всё остальное - комментарий
                        else {
                            comment += ' ' + seg;
                        }
                    }
                });

                // Если категория пустая, пробуем взять из typeLine (редкий случай)
                if (!category) category = typeLine;

                entries.push({ 
                    type, 
                    date: dateStr, 
                    dateObj: dateObj, 
                    amount, 
                    category: category.trim(), 
                    comment: comment.trim() 
                });
            });

            return entries;
        }

        function renderDashboard(entries) {
            let totalIncome = 0, totalExpense = 0, totalSavings = 0;

            const container = document.getElementById('entriesList');
            container.innerHTML = '';
            
            if (entries.length === 0) {
                container.innerHTML = '<div class="empty-state">📭 Записи не найдены за выбранный период.</div>';
                updateSummary(0, 0, 0, 0);
                return;
            }

            // Сортировка: новые сверху
            entries.sort((a, b) => {
                if (!a.dateObj) return 1;
                if (!b.dateObj) return -1;
                return b.dateObj.getTime() - a.dateObj.getTime();
            });

            entries.forEach(e => {
                if (e.type === 'income') totalIncome += e.amount;
                if (e.type === 'expense') totalExpense += e.amount;
                if (e.type === 'savings') totalSavings += e.amount;

                const card = document.createElement('div');
                card.className = `entry-card ${e.type}`;
                card.innerHTML = `
                    <div class="entry-header">
                        <span class="badge ${e.type}">${e.type === 'income' ? '🟢 Доход' : e.type === 'expense' ? '🔴 Расход' : '💸 Накопления'}</span>
                        <span class="date">${e.date}</span>
                    </div>
                    <div class="entry-body">
                        <span class="amount">${e.amount.toLocaleString('ru-RU')} ₽</span>
                        ${e.category ? `<span class="category">${e.category}</span>` : ''}
                        ${e.comment ? `<span class="comment">💬 ${e.comment}</span>` : ''}
                    </div>
                `;
                container.appendChild(card);
            });

            updateSummary(totalIncome, totalExpense, totalSavings, totalIncome - totalExpense);
        }

        function updateSummary(income, expense, savings, balance) {
            document.getElementById('sumIncome').textContent = income.toLocaleString('ru-RU') + ' ₽';
            document.getElementById('sumExpense').textContent = expense.toLocaleString('ru-RU') + ' ₽';
            document.getElementById('sumBalance').textContent = balance.toLocaleString('ru-RU') + ' ₽';
            document.getElementById('sumSavings').textContent = savings.toLocaleString('ru-RU') + ' ₽';
            document.getElementById('updateTime').textContent = `🕒 Обновлено: ${new Date().toLocaleString('ru-RU', { hour: '2-digit', minute:'2-digit' })}`;
        }

        // --- Логика фильтрации ---

        function applyFilter() {
            const startVal = document.getElementById('dateStart').value;
            const endVal = document.getElementById('dateEnd').value;

            if (!startVal && !endVal) {
                resetFilter();
                return;
            }

            const startDate = startVal ? new Date(startVal) : new Date('1900-01-01');
            const endDate = endVal ? new Date(endVal) : new Date('2099-12-31');

            const filtered = ALL_ENTRIES.filter(item => {
                if (!item.dateObj) return false;
                return item.dateObj >= startDate && item.dateObj <= endDate;
            });

            renderDashboard(filtered);
        }

        function resetFilter() {
            document.getElementById('dateStart').value = '';
            document.getElementById('dateEnd').value = '';
            renderDashboard(ALL_ENTRIES);
        }

        // --- Инициализация ---

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const encodedData = urlParams.get('data');
            
            if (encodedData) {
                try {
                    const decodedData = decodeURIComponent(encodedData);
                    ALL_ENTRIES = parseFinanceData(decodedData);
                    renderDashboard(ALL_ENTRIES);
                } catch (e) {
                    console.error(e);
                    document.getElementById('entriesList').innerHTML = '<div class="empty-state">❌ Ошибка данных.</div>';
                }
            } else {
                document.getElementById('entriesList').innerHTML = '<div class="empty-state">ℹ️ Нет данных.</div>';
            }
        });
    </script>
</body>
</html>
