<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 Финансы: Статистика</title>
    <style>
        :root {
            --bg: #f4f6f9; --card: #ffffff; --text: #1f2937; --text2: #6b7280;
            --income: #10b981; --income-bg: #d1fae5;
            --expense: #ef4444; --expense-bg: #fee2e2;
            --savings: #3b82f6; --savings-bg: #dbeafe;
            --debt-active: #f59e0b; --debt-active-bg: #fef3c7; /* Мне должны (Активный) */
            --debt-passive: #8b5cf6; --debt-passive-bg: #ede9fe; /* Я должен (Пассивный) */
            --paid: #9ca3af; --paid-bg: #f3f4f6;
            --primary: #3b82f6; --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; padding: 16px; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 16px; font-size: 1.6rem; }
        
        .filters-container { background: var(--card); padding: 12px; border-radius: 12px; box-shadow: var(--shadow); margin-bottom: 20px; }
        .time-filters { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 12px; padding-bottom: 4px; border-bottom: 1px solid #f3f4f6; }
        .btn-time { flex: 1; min-width: 70px; padding: 8px; background: #f3f4f6; color: var(--text); border: none; border-radius: 6px; font-weight: 600; cursor: pointer; white-space: nowrap; font-size: 13px; }
        .btn-time.active { background: var(--primary); color: white; }

        .type-filters { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        .btn-type { padding: 6px 12px; border: 2px solid #e5e7eb; background: white; color: var(--text2); border-radius: 20px; font-weight: 600; cursor: pointer; font-size: 12px; transition: all 0.2s; }
        .btn-type.active { border-color: transparent; color: white; }
        .btn-type[data-type="income"].active { background: var(--income); }
        .btn-type[data-type="expense"].active { background: var(--expense); }
        .btn-type[data-type="savings"].active { background: var(--savings); }
        .btn-type[data-type="debt"].active { background: var(--debt-active); }

        .summary { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
        @media(min-width:600px) { .summary { grid-template-columns: repeat(3, 1fr); } }
        @media(min-width:900px) { .summary { grid-template-columns: repeat(4, 1fr); } }
        
        .stat-card { background: var(--card); padding: 12px; border-radius: 12px; box-shadow: var(--shadow); text-align: center; }
        .stat-card h3 { font-size: 10px; color: var(--text2); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-card .value { font-size: 18px; font-weight: 800; }
        .val-income { color: var(--income); } .val-expense { color: var(--expense); } 
        .val-balance { color: #4b5563; } .val-savings { color: var(--savings); }
        .val-debt-active { color: var(--debt-active); }
        .val-debt-passive { color: var(--debt-passive); }

        .entries { display: flex; flex-direction: column; gap: 12px; }
        .entry-card { background: var(--card); padding: 14px 16px; border-radius: 12px; box-shadow: var(--shadow); border-left: 4px solid transparent; }
        .entry-card.income { border-left-color: var(--income); }
        .entry-card.expense { border-left-color: var(--expense); }
        .entry-card.savings { border-left-color: var(--savings); }
        .entry-card.debt-active { border-left-color: var(--debt-active); } 
        .entry-card.debt-passive { border-left-color: var(--debt-passive); }
        .entry-card.paid { border-left-color: var(--paid); opacity: 0.7; }
        
        .entry-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
        .badge.income { background: var(--income-bg); color: #065f46; }
        .badge.expense { background: var(--expense-bg); color: #991b1b; }
        .badge.savings { background: var(--savings-bg); color: #1e40af; }
        .badge.debt-active { background: var(--debt-active-bg); color: #92400e; }
        .badge.debt-passive { background: var(--debt-passive-bg); color: #5b21b6; }
        .badge.paid { background: var(--paid-bg); color: #4b5563; }
        
        .date { font-size: 13px; color: var(--text2); font-weight: 500; }
        .entry-body { display: flex; flex-wrap: wrap; gap: 10px; align-items: baseline; }
        .amount { font-size: 18px; font-weight: 700; min-width: 80px; }
        .category { background: #f3f4f6; padding: 4px 10px; border-radius: 8px; font-size: 14px; }
        .comment { font-size: 13px; color: var(--text2); font-style: italic; margin-left: auto; max-width: 40%; word-break: break-word; }

        .footer { text-align: center; margin-top: 24px; padding: 12px; font-size: 12px; color: #9ca3af; }
        .empty-state { text-align: center; padding: 30px; color: var(--text2); background: var(--card); border-radius: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Учет финансов</h1>
        
        <div class="filters-container">
            <div class="time-filters">
                <button class="btn-time active" onclick="setTimeFilter('all')">Все</button>
                <button class="btn-time" onclick="setTimeFilter('today')">Сегодня</button>
                <button class="btn-time" onclick="setTimeFilter('week')">Неделя</button>
                <button class="btn-time" onclick="setTimeFilter('month')">Месяц</button>
            </div>
            <div class="type-filters">
                <button class="btn-type active" data-type="income" onclick="toggleTypeFilter('income')">💵 Доходы</button>
                <button class="btn-type active" data-type="expense" onclick="toggleTypeFilter('expense')">💸 Расходы</button>
                <button class="btn-type active" data-type="savings" onclick="toggleTypeFilter('savings')">🏦 Накопления</button>
                <button class="btn-type active" data-type="debt" onclick="toggleTypeFilter('debt')">⚖️ Долги</button>
            </div>
        </div>

        <div class="summary" id="summaryBlock">
            <div class="stat-card"><h3>💵 Доходы</h3><div class="value val-income" id="sumIncome">0 ₽</div></div>
            <div class="stat-card"><h3>💸 Расходы</h3><div class="value val-expense" id="sumExpense">0 ₽</div></div>
            <div class="stat-card"><h3>⚖️ Баланс</h3><div class="value val-balance" id="sumBalance">0 ₽</div></div>
            <div class="stat-card"><h3>🏦 Накопления</h3><div class="value val-savings" id="sumSavings">0 ₽</div></div>
            <div class="stat-card"><h3>🤝 Мне должны</h3><div class="value val-debt-active" id="sumDebtActive">0 ₽</div></div>
            <div class="stat-card"><h3>🙏 Я должен</h3><div class="value val-debt-passive" id="sumDebtPassive">0 ₽</div></div>
        </div>

        <div class="entries" id="entriesList"></div>
        <div class="footer" id="updateTime"></div>
    </div>

    <script>
        let ALL_ENTRIES = [];
        let activeTypes = new Set(['income', 'expense', 'savings', 'debt']);
        let currentTimeFilter = 'all';

        function parseFinanceData(text) {
            if (text.trim().startsWith('{')) {
                try {
                    const json = JSON.parse(text);
                    if (json.text) text = json.text;
                } catch (e) {}
            }

            const blocks = text.split(/\n\s*\n/);
            const entries = [];
            
            blocks.forEach(block => {
                const lines = block.trim().split('\n').filter(l => l.trim());
                if (lines.length < 2) return;

                const typeLine = lines[0].trim();
                let baseType = 'unknown';
                
                // Определение базового типа по заголовку
                if (typeLine.includes('💸')) baseType = 'savings';
                else if (typeLine.includes('🟢') || typeLine.toLowerCase().includes('доход')) baseType = 'income';
                else if (typeLine.includes('🔴') || typeLine.toLowerCase().includes('расход')) baseType = 'expense';
                else if (typeLine.includes('💰') || typeLine.toLowerCase().includes('долги')) baseType = 'debt-wrapper';
                
                if (baseType === 'unknown') return;

                const rawContent = lines.slice(1).join(' ');
                const catLower = rawContent.toLowerCase();
                
                let finalType = baseType;
                let debtDirection = null; 

                // --- ИСПРАВЛЕННАЯ ЛОГИКА РАСПОЗНАВАНИЯ ДОЛГОВ ---

                // 1. Проверка на возвраты (погашение)
                if (catLower.includes('вернули мне') || catLower.includes('мне вернули')) {
                    finalType = 'paid'; debtDirection = 'paid-active';
                } 
                else if (catLower.includes('я вернул') || catLower.includes('вернул долг')) {
                    finalType = 'paid'; debtDirection = 'paid-passive';
                }
                // 2. Проверка на "Я должен" (Пассивный долг)
                // Если в тексте есть "нанял", "взял", "занял у" -> это мой долг
                else if (catLower.includes('нанял') || catLower.includes('взял в долг') || catLower.includes('занял у')) {
                    finalType = 'debt-passive'; debtDirection = 'passive';
                }
                // 3. Проверка на "Мне должны" (Активный долг)
                // Если в тексте есть "дал в долг", "отдал", "в долг" (без "взял") -> это долг мне
                else if (catLower.includes('дал в долг') || catLower.includes('отдал') || (catLower.includes('в долг') && !catLower.includes('взял'))) {
                    finalType = 'debt-active'; debtDirection = 'active';
                }

                const dateMatch = rawContent.match(/(\d{2}-\d{2}-\d{4})/);
                let dateStr = '—';
                let dateObj = null;
                
                if (dateMatch) {
                    dateStr = dateMatch[1];
                    const parts = dateStr.split('-');
                    dateObj = new Date(parts[2], parts[1] - 1, parts[0]);
                }

                const segments = rawContent.split('|').map(s => s.trim()).filter(s => s);
                let amount = 0;
                let category = '';
                let comment = '';
                
                let startIndex = 0;
                if (segments.length > 0 && /\d{2}:\d{2}/.test(segments[0])) {
                    startIndex = 1;
                }

                for (let i = startIndex; i < segments.length; i++) {
                    const seg = segments[i];
                    if (amount === 0) {
                        const numMatch = seg.match(/^(\d+(?:\.\d+)?)\s*[₽$€]?$/);
                        if (numMatch) {
                            amount = parseFloat(numMatch[1]);
                            continue; 
                        }
                    }
                    
                    if (/[\p{Emoji}]/u.test(seg)) {
                        if (!category) category = seg;
                        else comment += ' ' + seg;
                    } else {
                        if (!category) category = seg;
                        else comment += ' ' + seg;
                    }
                }

                entries.push({ 
                    type: finalType, 
                    debtDirection: debtDirection,
                    date: dateStr, 
                    dateObj: dateObj, 
                    amount, 
                    category: category.trim(), 
                    comment: comment.trim() 
                });
            });
            return entries;
        }

        function applyFilters() {
            const now = new Date();
            const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            
            let filtered = ALL_ENTRIES.filter(item => {
                let filterType = item.type;
                if (item.type === 'debt-active' || item.type === 'debt-passive' || item.type === 'paid') filterType = 'debt';
                
                if (!activeTypes.has(filterType) && !activeTypes.has(item.type)) return false;

                if (currentTimeFilter === 'all') return true;
                if (!item.dateObj) return false;

                if (currentTimeFilter === 'today') return item.dateObj >= todayStart;
                if (currentTimeFilter === 'week') {
                    const weekAgo = new Date(todayStart);
                    weekAgo.setDate(weekAgo.getDate() - 7);
                    return item.dateObj >= weekAgo;
                }
                if (currentTimeFilter === 'month') {
                    const monthAgo = new Date(todayStart);
                    monthAgo.setMonth(monthAgo.getMonth() - 1);
                    return item.dateObj >= monthAgo;
                }
                return true;
            });

            renderDashboard(filtered);
        }

        function toggleTypeFilter(type) {
            const btn = document.querySelector(`.btn-type[data-type="${type}"]`);
            if (activeTypes.has(type)) {
                activeTypes.delete(type);
                btn.classList.remove('active');
            } else {
                activeTypes.add(type);
                btn.classList.add('active');
            }
            applyFilters();
        }

        function setTimeFilter(period) {
            currentTimeFilter = period;
            document.querySelectorAll('.btn-time').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            applyFilters();
        }

        function renderDashboard(entries) {
            let totalIncome = 0, totalExpense = 0, totalSavings = 0;
            let totalDebtActive = 0; // Мне должны
            let totalDebtPassive = 0; // Я должен

            const container = document.getElementById('entriesList');
            container.innerHTML = '';
            
            if (entries.length === 0) {
                container.innerHTML = '<div class="empty-state">📭 Нет записей.</div>';
                updateSummary(0, 0, 0, 0, 0, 0);
                return;
            }

            entries.sort((a, b) => {
                if (!a.dateObj) return 1;
                if (!b.dateObj) return -1;
                return b.dateObj.getTime() - a.dateObj.getTime();
            });

            entries.forEach(e => {
                if (e.type === 'income') totalIncome += e.amount;
                if (e.type === 'expense') totalExpense += e.amount;
                if (e.type === 'savings') totalSavings += e.amount;
                
                // Логика долгов
                if (e.debtDirection === 'active') totalDebtActive += e.amount;
                if (e.debtDirection === 'passive') totalDebtPassive += e.amount;
                if (e.debtDirection === 'paid-active') totalDebtActive -= e.amount; 
                if (e.debtDirection === 'paid-passive') totalDebtPassive -= e.amount; 

                const card = document.createElement('div');
                card.className = `entry-card ${e.type}`;
                
                let badgeText = e.category;
                if (e.debtDirection === 'paid-active') badgeText = '✅ Вернули мне';
                if (e.debtDirection === 'paid-passive') badgeText = '✅ Я вернул';
                if (e.type === 'debt-active') badgeText = '🤝 Дал в долг';
                if (e.type === 'debt-passive') badgeText = '🙏 Взял в долг';

                card.innerHTML = `
                    <div class="entry-header">
                        <span class="badge ${e.type}">${badgeText}</span>
                        <span class="date">${e.date}</span>
                    </div>
                    <div class="entry-body">
                        <span class="amount">${e.amount.toLocaleString('ru-RU')} ₽</span>
                        ${e.comment ? `<span class="comment">💬 ${e.comment}</span>` : ''}
                    </div>
                `;
                container.appendChild(card);
            });

            const balance = totalIncome - totalExpense; 
            updateSummary(totalIncome, totalExpense, balance, totalSavings, totalDebtActive, totalDebtPassive);
        }

        function updateSummary(income, expense, balance, savings, debtActive, debtPassive) {
            document.getElementById('sumIncome').textContent = income.toLocaleString('ru-RU') + ' ₽';
            document.getElementById('sumExpense').textContent = expense.toLocaleString('ru-RU') + ' ₽';
            document.getElementById('sumBalance').textContent = balance.toLocaleString('ru-RU') + ' ₽';
            document.getElementById('sumSavings').textContent = savings.toLocaleString('ru-RU') + ' ₽';
            document.getElementById('sumDebtActive').textContent = debtActive.toLocaleString('ru-RU') + ' ₽';
            document.getElementById('sumDebtPassive').textContent = debtPassive.toLocaleString('ru-RU') + ' ₽';
        }

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const encodedData = urlParams.get('data');
            
            if (encodedData) {
                try {
                    const decodedData = decodeURIComponent(encodedData);
                    ALL_ENTRIES = parseFinanceData(decodedData);
                    applyFilters();
                } catch (e) {
                    console.error(e);
                    document.getElementById('entriesList').innerHTML = '<div class="empty-state">❌ Ошибка данных.</div>';
                }
            }
        });
    </script>
</body>
</html>
