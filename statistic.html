<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Финансовая статистика</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #181818;
      color: #fff;
      padding: 20px;
    }
    h1 {
      text-align: center;
      font-size: 36px;
      margin-bottom: 20px;
    }
    .transaction {
      background-color: #2c2c2c;
      padding: 15px;
      margin: 10px 0;
      border-radius: 8px;
    }
    .transaction h2 {
      margin: 0;
      font-size: 24px;
      color: #76c7c0;
    }
    .transaction .info {
      font-size: 18px;
    }
    .income {
      color: #76c7c0;
    }
    .expense {
      color: #e57373;
    }
    .category {
      font-weight: bold;
    }
    .comment {
      font-style: italic;
      color: #bbb;
    }
    .date {
      color: #aaa;
    }
    .summary {
      background-color: #333;
      padding: 15px;
      border-radius: 8px;
      margin-top: 30px;
    }
    .summary h3 {
      margin-top: 0;
      color: #76c7c0;
    }
    /* Стиль для формы */
    form {
      margin-top: 20px;
      background-color: #333;
      padding: 15px;
      border-radius: 8px;
    }
    input, select {
      margin: 5px;
      padding: 10px;
      font-size: 16px;
      background-color: #444;
      color: #fff;
      border: none;
      border-radius: 4px;
    }
    button {
      background-color: #76c7c0;
      color: #fff;
      padding: 10px 20px;
      border: none;
      cursor: pointer;
      border-radius: 4px;
      font-size: 16px;
    }
    button:hover {
      background-color: #64a3a3;
    }
  </style>
</head>
<body>

  <h1>Финансовая информация</h1>

  <div class="summary">
    <h3>Статистика за сегодня</h3>
    <p>💸 Накоплено: <span id="todayTotal">0</span> ₽</p>
    <p>🟢 Доходы: <span id="todayIncome">0</span> ₽</p>
    <p>🔴 Расходы: <span id="todayExpenses">0</span> ₽</p>
  </div>

  <div id="transactionsContainer"></div>

  <!-- Форма для добавления новых транзакций -->
  <form id="transactionForm">
    <h3>Добавить транзакцию</h3>
    <input type="number" id="amount" placeholder="Сумма" required>
    <select id="category" required>
      <option value="💼 Подработка">💼 Подработка</option>
      <option value="💰 Зарплата">💰 Зарплата</option>
      <option value="🛒 Продукты">🛒 Продукты</option>
      <option value="🍽 Кафе, ресторан">🍽 Кафе, ресторан</option>
      <option value="🏠 Квартира, коммуналка">🏠 Квартира, коммуналка</option>
      <option value="📦 Другое">📦 Другое</option>
    </select>
    <input type="text" id="comment" placeholder="Комментарий" required>
    <button type="submit">Добавить транзакцию</button>
  </form>

  <script>
    // Массив для хранения транзакций
    let transactions = [];

    // Функция для отображения транзакций
    function addTransaction(transaction) {
      const transactionContainer = document.getElementById("transactionsContainer");

      const transactionElement = document.createElement('div');
      transactionElement.classList.add('transaction');
      transactionElement.classList.add(transaction.type);

      transactionElement.innerHTML = `
        <h2>${transaction.type === 'income' ? '🟢 ДОХОД' : '🔴 РАСХОД'}</h2>
        <p class="info">
          <span class="date">${transaction.date}</span> | <span class="amount">${transaction.amount} ₽</span><br>
          <span class="category">${transaction.category}</span> | <span class="comment">${transaction.comment}</span>
        </p>
      `;
      transactionContainer.appendChild(transactionElement);
    }

    // Обновление статистики
    function updateStats() {
      let totalIncome = 0;
      let totalExpenses = 0;
      transactions.forEach(transaction => {
        if (transaction.type === 'income') totalIncome += transaction.amount;
        if (transaction.type === 'expense') totalExpenses += transaction.amount;
      });
      document.getElementById('todayIncome').textContent = totalIncome;
      document.getElementById('todayExpenses').textContent = totalExpenses;
      document.getElementById('todayTotal').textContent = totalIncome - totalExpenses;
    }

    // Обработчик отправки формы
    document.getElementById("transactionForm").addEventListener("submit", function(event) {
      event.preventDefault();

      const amount = parseFloat(document.getElementById("amount").value);
      const category = document.getElementById("category").value;
      const comment = document.getElementById("comment").value;
      const date = new Date().toLocaleString(); // Текущая дата и время

      // Создаём новую транзакцию
      const transaction = {
        type: amount >= 0 ? 'income' : 'expense',
        date: date,
        amount: Math.abs(amount),
        category: category,
        comment: comment
      };

      // Добавляем транзакцию в массив
      transactions.push(transaction);

      // Добавляем транзакцию на страницу
      addTransaction(transaction);

      // Обновляем статистику
      updateStats();

      // Очистить форму
      document.getElementById("transactionForm").reset();
    });

    // Изначально добавляем несколько транзакций для демонстрации
    transactions.push({ type: 'income', date: '12-04-2026, 17:39', amount: 5000, category: '💼 Подработка', comment: 'Без комментариев' });
    transactions.push({ type: 'expense', date: '12-04-2026, 20:47', amount: 200, category: '🛒 Продукты', comment: 'Без комментариев' });
    transactions.push({ type: 'income', date: '13-04-2026, 16:50', amount: 2000, category: '💼 Подработка', comment: 'Без комментариев' });

    // Отображаем изначальные транзакции и обновляем статистику
    transactions.forEach(transaction => addTransaction(transaction));
    updateStats();
  </script>

</body>
</html>
