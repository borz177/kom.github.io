<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Финансовая статистика</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #181818;
      color: #fff;
      padding: 20px;
    }
    h1 {
      text-align: center;
      font-size: 36px;
      margin-bottom: 20px;
    }
    .transaction {
      background-color: #2c2c2c;
      padding: 15px;
      margin: 10px 0;
      border-radius: 8px;
    }
    .transaction h2 {
      margin: 0;
      font-size: 24px;
      color: #76c7c0;
    }
    .transaction .info {
      font-size: 18px;
    }
    .income {
      color: #76c7c0;
    }
    .expense {
      color: #e57373;
    }
    .category {
      font-weight: bold;
    }
    .comment {
      font-style: italic;
      color: #bbb;
    }
    .date {
      color: #aaa;
    }
    .summary {
      background-color: #333;
      padding: 15px;
      border-radius: 8px;
      margin-top: 30px;
    }
    .summary h3 {
      margin-top: 0;
      color: #76c7c0;
    }
  </style>
</head>
<body>

  <h1>Финансовая информация</h1>

  <!-- Статистика за день -->
  <div class="summary">
    <h3>Статистика за сегодня</h3>
    <p>💸 Накоплено: <span id="todayTotal"></span> ₽</p>
    <p>🟢 Доходы: <span id="todayIncome"></span> ₽</p>
    <p>🔴 Расходы: <span id="todayExpenses"></span> ₽</p>
  </div>

  <!-- Статистика за неделю -->
  <div class="summary">
    <h3>Статистика за неделю</h3>
    <p>💸 Накоплено: <span id="weekTotal"></span> ₽</p>
    <p>🟢 Доходы: <span id="weekIncome"></span> ₽</p>
    <p>🔴 Расходы: <span id="weekExpenses"></span> ₽</p>
  </div>

  <!-- Статистика за месяц -->
  <div class="summary">
    <h3>Статистика за месяц</h3>
    <p>💸 Накоплено: <span id="monthTotal"></span> ₽</p>
    <p>🟢 Доходы: <span id="monthIncome"></span> ₽</p>
    <p>🔴 Расходы: <span id="monthExpenses"></span> ₽</p>
  </div>

  <div id="transactionsContainer"></div>

  <script>
    // Функция для добавления транзакций
    function addTransaction(type, date, amount, category, comment) {
      const transactionContainer = document.getElementById("transactionsContainer");

      const transaction = document.createElement('div');
      transaction.classList.add('transaction');
      transaction.classList.add(type);

      transaction.innerHTML = `
        <h2>${type === 'income' ? '🟢 ДОХОД' : '🔴 РАСХОД'}</h2>
        <p class="info">
          <span class="date">${date}</span> | <span class="amount">${amount} ₽</span><br>
          <span class="category">${category}</span> | <span class="comment">${comment}</span>
        </p>
      `;
      transactionContainer.appendChild(transaction);
    }

    // Данные для отображения
    const transactions = [
      { type: 'income', date: '12-04-2026, 17:39', amount: 5000, category: '💼 Подработка', comment: 'Без комментариев' },
      { type: 'income', date: '12-04-2026, 17:40', amount: 5000, category: '💰 Зарплата', comment: 'Без комментариев' },
      { type: 'expense', date: '12-04-2026, 20:47', amount: 200, category: '🛒 Продукты', comment: 'Без комментариев' },
      { type: 'income', date: '13-04-2026, 16:50', amount: 2000, category: '💼 Подработка', comment: 'Без комментариев' },
      { type: 'income', date: '13-04-2026, 16:57', amount: 5000, category: '📦 Другое', comment: 'Без комментариев' },
      { type: 'expense', date: '13-04-2026, 17:01', amount: 266, category: '📝 Другое', comment: 'Без комментариев' },
      { type: 'expense', date: '13-04-2026, 17:04', amount: 55, category: '🌐 Интернет', comment: 'Просто' },
      { type: 'expense', date: '13-04-2026, 17:05', amount: 554, category: '🏠 Квартира, Коммуналка', comment: 'Без комментариев' },
      { type: 'expense', date: '13-04-2026, 17:15', amount: 94, category: '🍽️ Кафе, ресторан', comment: 'Просто' }
    ];

    // Добавление транзакций
    transactions.forEach(transaction => {
      addTransaction(transaction.type, transaction.date, transaction.amount, transaction.category, transaction.comment);
    });

    // Статистика за сегодня, неделю и месяц (примерные данные)
    document.getElementById('todayIncome').textContent = 12000;
    document.getElementById('todayExpenses').textContent = 500;
    document.getElementById('todayTotal').textContent = 11500;

    document.getElementById('weekIncome').textContent = 25000;
    document.getElementById('weekExpenses').textContent = 4000;
    document.getElementById('weekTotal').textContent = 21000;

    document.getElementById('monthIncome').textContent = 35000;
    document.getElementById('monthExpenses').textContent = 6000;
    document.getElementById('monthTotal').textContent = 29000;
  </script>

</body>
</html>
