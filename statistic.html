<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 Финансовая статистика</title>
    <style>
        :root {
            --bg: #f4f6f9;
            --card: #ffffff;
            --text: #1f2937;
            --text-secondary: #6b7280;
            --income: #10b981;
            --income-bg: #d1fae5;
            --expense: #ef4444;
            --expense-bg: #fee2e2;
            --savings: #3b82f6;
            --savings-bg: #dbeafe;
            --border: #e5e7eb;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        
        h1 { text-align: center; margin-bottom: 20px; font-size: 1.8rem; }
        
        .input-area { background: var(--card); padding: 20px; border-radius: 12px; box-shadow: var(--shadow); margin-bottom: 24px; }
        textarea { width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: 8px; font-family: inherit; font-size: 14px; resize: vertical; min-height: 120px; transition: border-color 0.2s; }
        textarea:focus { outline: none; border-color: #3b82f6; }
        .btn { width: 100%; margin-top: 12px; padding: 12px; background: #3b82f6; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background: #2563eb; }

        .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 24px; }
        .stat-card { background: var(--card); padding: 16px; border-radius: 12px; box-shadow: var(--shadow); text-align: center; }
        .stat-card h3 { font-size: 13px; color: var(--text-secondary); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-card .value { font-size: 20px; font-weight: 700; }
        .val-income { color: var(--income); }
        .val-expense { color: var(--expense); }
        .val-balance { color: #8b5cf6; }
        .val-savings { color: var(--savings); }

        .entries { display: flex; flex-direction: column; gap: 12px; }
        .entry-card { background: var(--card); padding: 16px; border-radius: 12px; box-shadow: var(--shadow); border-left: 4px solid transparent; }
        .entry-card.income { border-left-color: var(--income); }
        .entry-card.expense { border-left-color: var(--expense); }
        .entry-card.savings { border-left-color: var(--savings); }
        
        .entry-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; }
        .badge.income { background: var(--income-bg); color: #065f46; }
        .badge.expense { background: var(--expense-bg); color: #991b1b; }
        .badge.savings { background: var(--savings-bg); color: #1e40af; }
        .date { font-size: 13px; color: var(--text-secondary); }
        
        .entry-body { display: flex; flex-wrap: wrap; gap: 12px; align-items: baseline; }
        .amount { font-size: 18px; font-weight: 700; }
        .category { background: #f3f4f6; padding: 4px 8px; border-radius: 6px; font-size: 14px; }
        .comment { font-size: 13px; color: var(--text-secondary); font-style: italic; margin-left: auto; }

        @media (max-width: 480px) {
            .summary { grid-template-columns: 1fr 1fr; }
            .entry-body { flex-direction: column; gap: 6px; }
            .comment { margin-left: 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Учет финансов</h1>
        
        <div class="input-area">
            <textarea id="rawInput" placeholder="Вставьте сюда текст из Заметок..."></textarea>
            <button class="btn" onclick="processData()">🔄 Обработать и показать статистику</button>
        </div>

        <div class="summary" id="summaryBlock">
            <div class="stat-card"><h3>💵 Доходы</h3><div class="value val-income" id="sumIncome">0 ₽</div></div>
            <div class="stat-card"><h3>💸 Расходы</h3><div class="value val-expense" id="sumExpense">0 ₽</div></div>
            <div class="stat-card"><h3>⚖️ Баланс</h3><div class="value val-balance" id="sumBalance">0 ₽</div></div>
            <div class="stat-card"><h3>🏦 Накопления</h3><div class="value val-savings" id="sumSavings">0 ₽</div></div>
        </div>

        <div class="entries" id="entriesList"></div>
    </div>

    <script>
        function parseFinanceData(text) {
            const blocks = text.split(/\n\s*\n/);
            const entries = [];
            let totalIncome = 0, totalExpense = 0, totalSavings = 0;

            blocks.forEach(block => {
                const lines = block.trim().split('\n').filter(l => l.trim());
                if (lines.length === 0) return;

                const typeLine = lines[0].trim();
                let type = 'unknown';
                if (typeLine.includes('💸')) type = 'savings';
                else if (typeLine.includes('🟢')) type = 'income';
                else if (typeLine.includes('🔴')) type = 'expense';
                
                if (type === 'unknown') return; // Пропускаем заголовки типа "Доходы - расходы"

                // Объединяем все строки после заголовка в одну
                const rawContent = lines.slice(1).join(' ').replace(/\s+/g, ' ');
                const dateMatch = rawContent.match(/(\d{2}-\d{2}-\d{4},?\s*\d{2}:\d{2})/);
                const date = dateMatch ? dateMatch[1].replace(/\s*,\s*/g, ', ') : '—';

                // Разбиваем по |
                const segments = rawContent.split('|').map(s => s.trim()).filter(s => s);
                const dataSegments = dateMatch ? segments.filter(s => s !== dateMatch[1]) : segments;

                let amount = 0, category = '', comment = '';

                dataSegments.forEach(seg => {
                    const numMatch = seg.match(/(\d+(?:\.\d+)?)/);
                    // Ищем число, если оно ещё не найдено
                    if (numMatch && amount === 0) {
                        amount = parseFloat(numMatch[1]);
                        const extra = seg.replace(numMatch[0], '').replace(/[₽$€]/g, '').trim();
                        if (extra) comment += ' ' + extra;
                    } 
                    // Ищем категорию (обычно содержит эмодзи)
                    else if (/[\p{Emoji}]/u.test(seg) && !category) {
                        category = seg;
                    } 
                    // Если категории нет, считаем текущий сегмент категорией
                    else if (!category) {
                        category = seg;
                    } 
                    // Всё остальное идёт в комментарий
                    else {
                        comment += ' ' + seg;
                    }
                });

                if (type === 'income') totalIncome += amount;
                if (type === 'expense') totalExpense += amount;
                if (type === 'savings') totalSavings += amount;

                entries.push({ type, date, amount, category: category.trim(), comment: comment.trim() });
            });

            return { entries, totalIncome, totalExpense, totalSavings, balance: totalIncome - totalExpense };
        }

        function processData() {
            const text = document.getElementById('rawInput').value;
            if (!text.trim()) {
                alert('⚠️ Вставьте текст из заметок в поле ввода!');
                return;
            }

            const { entries, totalIncome, totalExpense, totalSavings, balance } = parseFinanceData(text);

            // Обновляем сводку
            document.getElementById('sumIncome').textContent = totalIncome.toLocaleString('ru-RU') + ' ₽';
            document.getElementById('sumExpense').textContent = totalExpense.toLocaleString('ru-RU') + ' ₽';
            document.getElementById('sumBalance').textContent = balance.toLocaleString('ru-RU') + ' ₽';
            document.getElementById('sumSavings').textContent = totalSavings.toLocaleString('ru-RU') + ' ₽';

            // Рендерим записи (сортировка: новые сверху)
            const container = document.getElementById('entriesList');
            container.innerHTML = '';
            entries.sort((a, b) => b.date.localeCompare(a.date));

            if (entries.length === 0) {
                container.innerHTML = '<p style="text-align:center;color:#6b7280;">Не удалось найти записи. Проверьте формат текста.</p>';
                return;
            }

            entries.forEach(e => {
                const card = document.createElement('div');
                card.className = `entry-card ${e.type}`;
                card.innerHTML = `
                    <div class="entry-header">
                        <span class="badge ${e.type}">${e.type === 'income' ? '🟢 ДОХОД' : e.type === 'expense' ? '🔴 РАСХОД' : '💸 НАКОПЛЕНИЯ'}</span>
                        <span class="date">${e.date}</span>
                    </div>
                    <div class="entry-body">
                        <span class="amount">${e.amount.toLocaleString('ru-RU')} ₽</span>
                        ${e.category ? `<span class="category">${e.category}</span>` : ''}
                        ${e.comment ? `<span class="comment">💬 ${e.comment}</span>` : ''}
                    </div>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
