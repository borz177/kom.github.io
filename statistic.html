<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 Финансы: Статистика</title>
    <style>
        :root {
            --bg: #f4f6f9; --card: #ffffff; --text: #1f2937; --text2: #6b7280;
            --income: #10b981; --income-bg: #d1fae5;
            --expense: #ef4444; --expense-bg: #fee2e2;
            --savings: #3b82f6; --savings-bg: #dbeafe;
            --border: #e5e7eb; --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; padding: 16px; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 16px; font-size: 1.6rem; }
        
        .summary { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
        @media(min-width:600px) { .summary { grid-template-columns: repeat(4, 1fr); } }
        .stat-card { background: var(--card); padding: 16px; border-radius: 12px; box-shadow: var(--shadow); text-align: center; }
        .stat-card h3 { font-size: 12px; color: var(--text2); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-card .value { font-size: 22px; font-weight: 800; }
        .val-income { color: var(--income); } .val-expense { color: var(--expense); }
        .val-balance { color: #8b5cf6; } .val-savings { color: var(--savings); }

        .entries { display: flex; flex-direction: column; gap: 12px; }
        .entry-card { background: var(--card); padding: 14px 16px; border-radius: 12px; box-shadow: var(--shadow); border-left: 4px solid transparent; }
        .entry-card.income { border-left-color: var(--income); }
        .entry-card.expense { border-left-color: var(--expense); }
        .entry-card.savings { border-left-color: var(--savings); }
        
        .entry-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
        .badge.income { background: var(--income-bg); color: #065f46; }
        .badge.expense { background: var(--expense-bg); color: #991b1b; }
        .badge.savings { background: var(--savings-bg); color: #1e40af; }
        .date { font-size: 13px; color: var(--text2); font-weight: 500; }
        
        .entry-body { display: flex; flex-wrap: wrap; gap: 10px; align-items: baseline; }
        .amount { font-size: 18px; font-weight: 700; min-width: 80px; }
        .category { background: #f3f4f6; padding: 4px 10px; border-radius: 8px; font-size: 14px; }
        .comment { font-size: 13px; color: var(--text2); font-style: italic; margin-left: auto; max-width: 40%; word-break: break-word; }

        .footer { text-align: center; margin-top: 24px; padding: 12px; font-size: 12px; color: #9ca3af; }
        .empty-state { text-align: center; padding: 30px; color: var(--text2); background: var(--card); border-radius: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Учет финансов</h1>
        
        <div class="summary" id="summaryBlock">
            <div class="stat-card"><h3>💵 Доходы</h3><div class="value val-income" id="sumIncome">0 ₽</div></div>
            <div class="stat-card"><h3>💸 Расходы</h3><div class="value val-expense" id="sumExpense">0 ₽</div></div>
            <div class="stat-card"><h3>⚖️ Баланс</h3><div class="value val-balance" id="sumBalance">0 ₽</div></div>
            <div class="stat-card"><h3>🏦 Накопления</h3><div class="value val-savings" id="sumSavings">0 ₽</div></div>
        </div>

        <div class="entries" id="entriesList"></div>
        <div class="footer" id="updateTime"></div>
    </div>

    <script>
        function parseFinanceData(text) {
            const blocks = text.split(/\n\s*\n/);
            const entries = [];
            let totalIncome = 0, totalExpense = 0, totalSavings = 0;

            blocks.forEach(block => {
                const lines = block.trim().split('\n').filter(l => l.trim());
                if (lines.length < 2) return;

                const typeLine = lines[0].trim();
                let type = 'unknown';
                if (typeLine.includes('💸')) type = 'savings';
                else if (typeLine.includes('🟢')) type = 'income';
                else if (typeLine.includes('🔴')) type = 'expense';
                
                if (type === 'unknown') return;

                const rawContent = lines.slice(1).join(' ').replace(/\s+/g, ' ');
                const dateMatch = rawContent.match(/(\d{2}-\d{2}-\d{4},?\s*\d{2}:\d{2})/);
                const date = dateMatch ? dateMatch[1].replace(/\s*,\s*/g, ', ') : '—';

                const segments = rawContent.split('|').map(s => s.trim()).filter(s => s && s !== date);
                let amount = 0, category = '', comment = '';

                segments.forEach(seg => {
                    const numMatch = seg.match(/(\d+(?:\.\d+)?)/);
                    if (numMatch && amount === 0) {
                        amount = parseFloat(numMatch[1]);
                        const extra = seg.replace(numMatch[0], '').replace(/[₽$€]/g, '').trim();
                        if (extra) comment += ' ' + extra;
                    } else if (/[\p{Emoji}]/u.test(seg) && !category) {
                        category = seg;
                    } else if (!category) {
                        category = seg;
                    } else {
                        comment += ' ' + seg;
                    }
                });

                if (type === 'income') totalIncome += amount;
                if (type === 'expense') totalExpense += amount;
                if (type === 'savings') totalSavings += amount;

                entries.push({ type, date, amount, category: category.trim(), comment: comment.trim() });
            });

            return { entries, totalIncome, totalExpense, totalSavings, balance: totalIncome - totalExpense };
        }

        function renderDashboard(text) {
            const { entries, totalIncome, totalExpense, totalSavings, balance } = parseFinanceData(text);
            
            document.getElementById('sumIncome').textContent = totalIncome.toLocaleString('ru-RU') + ' ₽';
            document.getElementById('sumExpense').textContent = totalExpense.toLocaleString('ru-RU') + ' ₽';
            document.getElementById('sumBalance').textContent = balance.toLocaleString('ru-RU') + ' ₽';
            document.getElementById('sumSavings').textContent = totalSavings.toLocaleString('ru-RU') + ' ₽';
            document.getElementById('updateTime').textContent = `🕒 Обновлено: ${new Date().toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute:'2-digit' })}`;

            const container = document.getElementById('entriesList');
            container.innerHTML = '';
            
            if (entries.length === 0) {
                container.innerHTML = '<div class="empty-state">📭 Записи не найдены. Проверьте формат данных.</div>';
                return;
            }

            entries.sort((a, b) => b.date.localeCompare(a.date));

            entries.forEach(e => {
                const card = document.createElement('div');
                card.className = `entry-card ${e.type}`;
                card.innerHTML = `
                    <div class="entry-header">
                        <span class="badge ${e.type}">${e.type === 'income' ? '🟢 Доход' : e.type === 'expense' ? '🔴 Расход' : '💸 Накопления'}</span>
                        <span class="date">${e.date}</span>
                    </div>
                    <div class="entry-body">
                        <span class="amount">${e.amount.toLocaleString('ru-RU')} ₽</span>
                        ${e.category ? `<span class="category">${e.category}</span>` : ''}
                        ${e.comment ? `<span class="comment">💬 ${e.comment}</span>` : ''}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // 🚀 Читаем данные из URL параметра ?data=...
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const encodedData = urlParams.get('data');
            
            if (encodedData) {
                try {
                    const decodedData = decodeURIComponent(encodedData);
                    renderDashboard(decodedData);
                } catch (e) {
                    document.getElementById('entriesList').innerHTML = '<div class="empty-state">❌ Ошибка декодирования данных.</div>';
                }
            } else {
                document.getElementById('entriesList').innerHTML = '<div class="empty-state">ℹ️ Нет данных. Запустите команду "Учет финансов" → "Статистика".</div>';
            }
        });
    </script>
</body>
</html>
